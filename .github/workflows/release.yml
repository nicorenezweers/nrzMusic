name: Release

# Runs when a GitHub release is published (or by hand for an existing tag):
# - pushes the multi-arch image ghcr.io/<owner>/nrz-music:<version> (+ :latest)
# - attaches the program for linux amd64 and arm64 to the release, with Rocket.toml and SHA256SUMS
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Version and image name
        id: v
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nrz-music" >> "$GITHUB_OUTPUT"

      # Rust is cross-compiled and yt-dlp/Deno are downloaded on the runner; only the apt step of
      # the runtime stage (ca-certificates, ffmpeg) runs under QEMU.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Program
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dist
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            cp "dist/linux_$arch/nrzmusic" "nrzmusic-$VERSION-linux-$arch"
            chmod +x "nrzmusic-$VERSION-linux-$arch"
          done
          # Rocket.toml (from the checked-out tag) carries the defaults: port 8350, upload limits
          sha256sum nrzmusic-$VERSION-linux-* Rocket.toml > SHA256SUMS
          gh release upload "$TAG" nrzmusic-$VERSION-linux-* Rocket.toml SHA256SUMS --clobber

      - name: Image (linux/amd64, linux/arm64)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=nrzMusic
            org.opencontainers.image.description=Self-hosted music client written in Rust: your own music folder, YouTube Music with downloads (yt-dlp) and your Spotify library
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The multi-arch digest is what the umbrelOS store pins (image:<version>@sha256:…).
      - name: Digest
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          VERSION: ${{ steps.v.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:$VERSION@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
