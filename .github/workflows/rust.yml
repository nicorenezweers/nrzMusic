name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Server, shared types, the YouTube Music and the Spotify client and the build tool xtask
  # (the Cargo workspace). yt-dlp and ffmpeg are not needed here: the download tests use a fake
  # yt-dlp.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Web interface (Dioxus → WebAssembly), its own Cargo project in ui/
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      # assets/tailwind.css is generated by Tailwind (input from `cargo xtask css`) during
      # `dx serve`/`dx bundle` and is not in git; asset!() only needs the file to exist here.
      - name: Placeholder for the generated stylesheet
        run: test -f assets/tailwind.css || touch assets/tailwind.css
      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
