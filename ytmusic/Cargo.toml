[package]
name = "nrzmusic-ytmusic"
version = "1.4.0"
edition = "2021"
description = "nrzMusic – Client für YouTube Music (InnerTube-API: Suche, Alben, Playlists, Künstler, Radio)"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
nrzmusic-types = { path = "../types" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
